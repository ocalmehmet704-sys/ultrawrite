<title>Sayfa bulunamadı: ultrawrite</title>

<style>
:root{--bg:#f6f1e9;--fg:#1d1a16;--mute:#5f574c;--acc:#9a3b26}

body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:400 17px/1.65 Geist,system-ui,sans-serif}
main{padding:32px;max-width:560px}
h1{font:400 56px/1.1 Fraunces,Georgia,serif;margin:0 0 16px}
h1 s{color:var(--mute);text-decoration-color:var(--acc)}
p{color:var(--mute)}
a{color:var(--acc)}
</style>
</head>
<body>
<main>
<h1>Bu sayfa yok.</h1>
<p>Aradığınız adres bulunamadı. <a href="/ultrawrite/">Ana sayfaya dönün.</a></p>
